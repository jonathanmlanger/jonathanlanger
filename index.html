<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jonathan Langer</title>
<meta name="description" content="Jonathan Langer: curriculum design and educational technology. Portfolio coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F7F9;--ink:#1B2631;--muted:#56626F;--learn:#A86A12;--build:#28598A;--focus:#28598A;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#141A20;--ink:#E7ECF0;--muted:#A3AFBA;--learn:#E0A64F;--build:#7FB0E0;--focus:#7FB0E0;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:2rem 1.5rem}
main{max-width:34rem}
h1{font-family:"Newsreader",Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(2.4rem,7vw,3.4rem);line-height:1.1;margin:0 0 1.5rem}
ul{list-style:none;margin:0 0 2rem;padding:0;display:grid;gap:.75rem}
li{padding-left:1rem;border-left:4px solid;font-size:1.15rem}
li:first-child{border-color:var(--learn)}
li:last-child{border-color:var(--build)}
p{color:var(--muted);margin:0 0 .75rem}
a{color:var(--ink);font-weight:600}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
</style>
</head>
<body>
<main>
  <h1>Jonathan Langer</h1>
  <ul>
    <li>I design how people learn technical skills.</li>
    <li>I build the tools that make that learning run.</li>
  </ul>
  <p>My full portfolio of curriculum and software projects is on its way.</p>
  <p>In the meantime, reach me at <a href="mailto:hello@jonathanlanger.com">hello@jonathanlanger.com</a>.</p>
</main>
</body>
</html>
